<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TickTask — Colorful Timed To-Dos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0d0a24;
    --bg2: #2b2660;
    --bg3: #1e1b3a;
    --card-radius: 24px;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 17px; }

  body {
    min-height: 100vh;
    font-family: var(--font);
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-attachment: fixed;
    color: #fff;
    padding: 48px 16px 90px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* soft ambient glow blobs */
  body::before, body::after {
    content: "";
    position: fixed;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    filter: blur(130px);
    opacity: .32;
    pointer-events: none;
    z-index: 0;
  }
  body::before { background: #ff6ec4; top: -180px; left: -160px; }
  body::after  { background: #4adede; bottom: -200px; right: -160px; }

  .container { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 36px; }

  header h1 {
    font-size: clamp(2.6rem, 6vw, 3.8rem);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ffe66d);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 6s ease infinite;
    filter: drop-shadow(0 4px 22px rgba(120,115,245,.45));
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  header p {
    color: rgba(255,255,255,.66);
    margin-top: 10px;
    font-size: 1.15rem;
    font-weight: 500;
  }

  /* ---------- Add form ---------- */
  .add-form {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: var(--card-radius);
    padding: 18px;
    margin-bottom: 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }

  .add-form input[type="text"] {
    flex: 1 1 250px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 1.05rem;
    font-family: inherit;
    font-weight: 500;
    color: #fff;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }

  .add-form input[type="text"]::placeholder { color: rgba(255,255,255,.42); }

  .add-form input[type="text"]:focus {
    border-color: #9a95ff;
    background: rgba(255,255,255,.13);
    box-shadow: 0 0 0 4px rgba(120,115,245,.28);
  }

  .minutes-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 0 14px;
    transition: border-color .2s, box-shadow .2s;
  }

  .minutes-wrap:focus-within {
    border-color: #9a95ff;
    box-shadow: 0 0 0 4px rgba(120,115,245,.28);
  }

  .minutes-wrap input {
    width: 62px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 1.1rem;
    font-family: inherit;
    font-weight: 700;
    text-align: center;
    outline: none;
    padding: 16px 0;
  }

  .minutes-wrap span { color: rgba(255,255,255,.55); font-size: .95rem; font-weight: 500; }

  .btn-add {
    background: linear-gradient(135deg, #ff6ec4, #7873f5);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 1.08rem;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: .3px;
    padding: 16px 30px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, filter .15s;
    box-shadow: 0 6px 22px rgba(255,110,196,.45);
  }

  .btn-add:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 8px 30px rgba(255,110,196,.6);
  }
  .btn-add:active { transform: translateY(0) scale(.98); }

  /* ---------- Task cards ---------- */
  .task-list { display: flex; flex-direction: column; gap: 18px; }

  .task {
    display: flex;
    align-items: center;
    gap: 18px;
    border-radius: var(--card-radius);
    padding: 20px 22px;
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.38);
    animation: slideIn .35s ease both;
    position: relative;
    overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .task:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 42px rgba(0,0,0,.45);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* progress fill behind content */
  .task .fill {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.17);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform 1s linear;
    pointer-events: none;
    will-change: transform;
  }

  .task > *:not(.fill) { position: relative; z-index: 1; }

  .task.c0 { background: linear-gradient(135deg, #f857a6, #ff5858); }
  .task.c1 { background: linear-gradient(135deg, #7873f5, #4adede); }
  .task.c2 { background: linear-gradient(135deg, #f7971e, #ffd200); color: #3a2a00; }
  .task.c3 { background: linear-gradient(135deg, #11998e, #38ef7d); color: #06301e; }
  .task.c4 { background: linear-gradient(135deg, #fc466b, #3f5efb); }
  .task.c5 { background: linear-gradient(135deg, #c471ed, #f64f59); }

  .task.done { filter: saturate(.35) brightness(.75); }
  .task.done .title { text-decoration: line-through; opacity: .7; }

  .task.expired { animation: shake .5s ease, slideIn 0s; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* timer ring */
  .ring { flex-shrink: 0; width: 86px; height: 86px; position: relative; }

  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }

  .ring circle {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
  }

  .ring .track { stroke: rgba(255,255,255,.25); }
  .task.c2 .ring .track, .task.c3 .ring .track { stroke: rgba(0,0,0,.15); }

  .ring .progress {
    stroke: #fff;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.6));
  }
  .task.c2 .ring .progress, .task.c3 .ring .progress {
    stroke: rgba(0,0,0,.65);
    filter: none;
  }

  .ring .time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
  }

  .task-body { flex: 1; min-width: 0; }

  .task-body .title {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -.2px;
    word-wrap: break-word;
    margin-bottom: 5px;
    text-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .task.c2 .title, .task.c3 .title { text-shadow: none; }

  .task-body .meta { font-size: .95rem; font-weight: 600; opacity: .85; }

  .task-actions { display: flex; gap: 9px; flex-shrink: 0; }

  .icon-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.22);
    color: inherit;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, transform .15s;
  }

  .task.c2 .icon-btn, .task.c3 .icon-btn { background: rgba(0,0,0,.14); }

  .icon-btn:hover { background: rgba(255,255,255,.4); transform: scale(1.12); }
  .icon-btn:active { transform: scale(1); }
  .task.c2 .icon-btn:hover, .task.c3 .icon-btn:hover { background: rgba(0,0,0,.25); }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: rgba(255,255,255,.5);
    font-size: 1.2rem;
    font-weight: 500;
    border: 2px dashed rgba(255,255,255,.18);
    border-radius: var(--card-radius);
  }

  .empty .pen {
    width: 64px;
    height: 64px;
    margin-bottom: 14px;
    filter: drop-shadow(0 6px 18px rgba(120,115,245,.5));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 32px;
    color: rgba(255,255,255,.58);
    font-size: 1rem;
    font-weight: 500;
  }

  .stats b { color: #fff; font-weight: 800; }

  @media (max-width: 540px) {
    html { font-size: 16px; }
    .task { flex-wrap: wrap; }
    .task-actions { margin-left: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⏱ TickTask</h1>
      <p>Add a task, set the clock, and race the countdown.</p>
    </header>

    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="What needs doing?" maxlength="120" autocomplete="off">
      <div class="minutes-wrap">
        <input type="number" id="minutesInput" value="30" min="1" max="999">
        <span>min</span>
      </div>
      <button type="submit" class="btn-add">+ Add</button>
    </form>

    <div class="task-list" id="taskList"></div>

    <div class="stats" id="stats"></div>
  </div>

<script>
(() => {
  const STORAGE_KEY = "ticktask.tasks.v1";
  const RADIUS = 32;
  const CIRC = 2 * Math.PI * RADIUS;

  let tasks = load();

  const form = document.getElementById("addForm");
  const taskInput = document.getElementById("taskInput");
  const minutesInput = document.getElementById("minutesInput");
  const listEl = document.getElementById("taskList");
  const statsEl = document.getElementById("stats");

  function load() {
    try {
      // running timers keep ticking across reloads via endsAt timestamps
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch { return []; }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function remainingSeconds(t) {
    if (t.status === "running") {
      return Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
    }
    return t.remaining;
  }

  function fmt(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    if (m >= 60) {
      const h = Math.floor(m / 60);
      return `${h}:${String(m % 60).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const title = taskInput.value.trim();
    const minutes = Math.min(999, Math.max(1, parseInt(minutesInput.value, 10) || 30));
    if (!title) { taskInput.focus(); return; }
    tasks.unshift({
      id: Date.now() + Math.random().toString(36).slice(2),
      title,
      total: minutes * 60,
      remaining: minutes * 60,
      status: "idle",          // idle | running | paused | done | expired
      endsAt: null,
      color: tasks.length % 6
    });
    taskInput.value = "";
    minutesInput.value = "30";
    save();
    render();
    playAdd();
    taskInput.focus();
  });

  function action(id, act) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (act === "delete") {
      tasks = tasks.filter(x => x.id !== id);
    } else if (act === "start") {
      t.status = "running";
      t.endsAt = Date.now() + t.remaining * 1000;
    } else if (act === "pause") {
      t.remaining = remainingSeconds(t);
      t.status = "paused";
      t.endsAt = null;
    } else if (act === "done") {
      t.remaining = remainingSeconds(t);
      t.status = "done";
      t.endsAt = null;
    } else if (act === "reset") {
      t.status = "idle";
      t.remaining = t.total;
      t.endsAt = null;
    }
    save();
    render();
  }

  listEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    action(btn.closest(".task").dataset.id, btn.dataset.act);
  });

  function render() {
    if (!tasks.length) {
      listEl.innerHTML = `
        <div class="empty">
          <svg class="pen" viewBox="0 0 24 24" aria-hidden="true">
            <defs>
              <linearGradient id="penGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff6ec4"/>
                <stop offset="55%" stop-color="#7873f5"/>
                <stop offset="100%" stop-color="#4adede"/>
              </linearGradient>
            </defs>
            <path fill="url(#penGrad)" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          <div>No tasks yet — add one above and beat the clock!</div>
        </div>`;
      statsEl.innerHTML = "";
      return;
    }

    listEl.innerHTML = tasks.map(t => {
      const rem = remainingSeconds(t);
      const frac = t.total ? rem / t.total : 0;
      const offset = CIRC * (1 - frac);
      const elapsedFrac = 1 - frac;

      let statusLabel, buttons;
      if (t.status === "done") {
        statusLabel = "✅ Completed";
        buttons = `
          <button class="icon-btn" data-act="reset" title="Restart">↺</button>
          <button class="icon-btn" data-act="delete" title="Delete">🗑</button>`;
      } else if (t.status === "expired") {
        statusLabel = "⏰ Time's up!";
        buttons = `
          <button class="icon-btn" data-act="reset" title="Restart">↺</button>
          <button class="icon-btn" data-act="done" title="Mark done">✔</button>
          <button class="icon-btn" data-act="delete" title="Delete">🗑</button>`;
      } else if (t.status === "running") {
        statusLabel = "🔥 In progress";
        buttons = `
          <button class="icon-btn" data-act="pause" title="Pause">⏸</button>
          <button class="icon-btn" data-act="done" title="Mark done">✔</button>
          <button class="icon-btn" data-act="delete" title="Delete">🗑</button>`;
      } else if (t.status === "paused") {
        statusLabel = "⏸ Paused";
        buttons = `
          <button class="icon-btn" data-act="start" title="Resume">▶</button>
          <button class="icon-btn" data-act="done" title="Mark done">✔</button>
          <button class="icon-btn" data-act="delete" title="Delete">🗑</button>`;
      } else {
        statusLabel = `🕒 Ready · ${Math.round(t.total / 60)} min`;
        buttons = `
          <button class="icon-btn" data-act="start" title="Start">▶</button>
          <button class="icon-btn" data-act="done" title="Mark done">✔</button>
          <button class="icon-btn" data-act="delete" title="Delete">🗑</button>`;
      }

      const cls = [
        "task", "c" + t.color,
        t.status === "done" ? "done" : "",
        t.status === "expired" ? "expired" : ""
      ].join(" ");

      return `
        <div class="${cls}" data-id="${t.id}">
          <div class="fill" style="transform: scaleX(${elapsedFrac.toFixed(4)})"></div>
          <div class="ring">
            <svg viewBox="0 0 74 74">
              <circle class="track" cx="37" cy="37" r="${RADIUS}"></circle>
              <circle class="progress" cx="37" cy="37" r="${RADIUS}"
                stroke-dasharray="${CIRC.toFixed(2)}"
                stroke-dashoffset="${offset.toFixed(2)}"></circle>
            </svg>
            <div class="time">${t.status === "done" ? "✓" : fmt(rem)}</div>
          </div>
          <div class="task-body">
            <div class="title"></div>
            <div class="meta">${statusLabel}</div>
          </div>
          <div class="task-actions">${buttons}</div>
        </div>`;
    }).join("");

    // set titles via textContent to avoid HTML injection
    listEl.querySelectorAll(".task").forEach(el => {
      const t = tasks.find(x => x.id === el.dataset.id);
      if (t) el.querySelector(".title").textContent = t.title;
    });

    const running = tasks.filter(t => t.status === "running").length;
    const done = tasks.filter(t => t.status === "done").length;
    statsEl.innerHTML =
      `<span><b>${tasks.length}</b> total</span>` +
      `<span><b>${running}</b> running</span>` +
      `<span><b>${done}</b> done</span>`;
  }

  // tick: update countdown displays in place without a full re-render
  setInterval(() => {
    let needsRender = false;
    for (const t of tasks) {
      if (t.status !== "running") continue;
      const rem = remainingSeconds(t);
      if (rem <= 0) {
        t.status = "expired";
        t.remaining = 0;
        t.endsAt = null;
        needsRender = true;
        playChime();
        continue;
      }
      const el = listEl.querySelector(`.task[data-id="${t.id}"]`);
      if (!el) continue;
      el.querySelector(".time").textContent = fmt(rem);
      const frac = rem / t.total;
      el.querySelector(".progress").style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
      el.querySelector(".fill").style.transform = `scaleX(${(1 - frac).toFixed(4)})`;
    }
    if (needsRender) { save(); render(); }
  }, 1000);

  let audioCtx = null;
  function getAudioCtx() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch { return null; /* audio not available */ }
  }

  function tone(ctx, freq, at, dur, peak) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak, at + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.05);
  }

  // soft rising two-note pop when a task is added
  function playAdd() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    tone(ctx, 523.25, now, 0.18, 0.06);         // C5
    tone(ctx, 783.99, now + 0.07, 0.25, 0.05);  // G5
  }

  // warm, quiet C-major chime when a timer runs out
  function playChime() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    [[523.25, 0], [659.25, 0.16], [783.99, 0.32]].forEach(([freq, off]) => {
      tone(ctx, freq, now + off, 0.9, 0.07);
      tone(ctx, freq * 2, now + off, 0.45, 0.015); // faint octave shimmer
    });
  }

  // mark already-expired running tasks on load
  for (const t of tasks) {
    if (t.status === "running" && remainingSeconds(t) <= 0) {
      t.status = "expired";
      t.remaining = 0;
      t.endsAt = null;
    }
  }
  save();
  render();
})();
</script>
</body>
</html>
